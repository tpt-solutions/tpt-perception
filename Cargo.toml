[workspace]
resolver = "2"
members = [
    "crates/tpt-percept-core",
    "crates/tpt-percept-cloud",
    "crates/tpt-percept-features",
    "crates/tpt-percept-register",
    "crates/tpt-percept-slam",
    "crates/tpt-percept-fusion",
    "crates/tpt-percept-map",
    "crates/tpt-percept-verify",
    "crates/tpt-percept-io",
    "crates/tpt-percept-cli",
    "crates/tpt-percept-py",
    "crates/tpt-percept-ros",
    "crates/tpt-percept-wasm",
    "crates/tpt-perception",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
homepage = "https://github.com/tpt-solutions/tpt-perception"
repository = "https://github.com/tpt-solutions/tpt-perception"

[workspace.dependencies]
# In-house perception crates.
tpt-percept-core = { version = "0.1.0", path = "crates/tpt-percept-core", default-features = false }
tpt-percept-cloud = { version = "0.1.0", path = "crates/tpt-percept-cloud", default-features = false }
tpt-percept-features = { version = "0.1.0", path = "crates/tpt-percept-features", default-features = false }
tpt-percept-register = { version = "0.1.0", path = "crates/tpt-percept-register", default-features = false }
tpt-percept-slam = { version = "0.1.0", path = "crates/tpt-percept-slam", default-features = false }
tpt-percept-fusion = { version = "0.1.0", path = "crates/tpt-percept-fusion", default-features = false }
tpt-percept-map = { version = "0.1.0", path = "crates/tpt-percept-map", default-features = false }
tpt-percept-verify = { version = "0.1.0", path = "crates/tpt-percept-verify" }
tpt-percept-io = { version = "0.1.0", path = "crates/tpt-percept-io" }
tpt-percept-cli = { version = "0.1.0", path = "crates/tpt-percept-cli" }
# Numeric substrate from crates.io (the same org's tpt-math workspace).
# All MIT OR Apache-2.0.
tpt-math-geometry = { version = "0.2.0", default-features = false }
tpt-math-linalg-fixed = { version = "0.2.0", default-features = false }
tpt-math-linalg-dense = { version = "0.2.0", default-features = false }
tpt-math-numeric = { version = "0.2.0", default-features = false }
tpt-math-units = { version = "0.1.0", default-features = false }
tpt-math-linalg-sparse = { version = "0.2.0", default-features = false }
# Property-based testing for statistical verification of geometric invariants.
# MIT OR Apache-2.0.
proptest = "1.5"
# Optional: serialisation of clouds, graphs and results (`serde` feature).
# MIT OR Apache-2.0. `no_std`-compatible with `alloc`.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# Optional: data-parallel correspondence search (`rayon` feature, std only).
# MIT OR Apache-2.0.
rayon = "1.10"
# Benchmarks (dev-only). MIT OR Apache-2.0.
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
