[package]
name = "tpt-perception"
description = "Umbrella crate for tpt-perception: feature-gated re-exports of the perception crates (core, cloud, features, register, slam, fusion, map, verify)."
readme = "README.md"
keywords = ["perception", "slam", "lidar", "pointcloud", "robotics", "umbrella", "sensor-fusion", "visual-odometry", "registration", "mapping", "verification"]
categories = ["science", "algorithms", "robotics", "simulation", "computer-vision"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
tpt-percept-core = { workspace = true, optional = true, features = ["std"] }
tpt-percept-cloud = { workspace = true, optional = true, features = ["std"] }
tpt-percept-features = { workspace = true, optional = true, features = ["std"] }
tpt-percept-register = { workspace = true, optional = true, features = ["std"] }
tpt-percept-slam = { workspace = true, optional = true, features = ["std"] }
tpt-percept-fusion = { workspace = true, optional = true, features = ["std"] }
tpt-percept-map = { workspace = true, optional = true, features = ["std"] }
tpt-percept-verify = { workspace = true, optional = true }
tpt-math-linalg-dense = { workspace = true, features = ["std"] }

[features]
default = ["core", "cloud", "features", "register", "slam", "fusion", "map"]
core = ["dep:tpt-percept-core"]
cloud = ["dep:tpt-percept-cloud"]
features = ["dep:tpt-percept-features"]
register = ["dep:tpt-percept-register"]
slam = ["dep:tpt-percept-slam"]
fusion = ["dep:tpt-percept-fusion"]
map = ["dep:tpt-percept-map"]
verify = ["dep:tpt-percept-verify"]
# Everything, including the verification harnesses (pulls proptest).
full = ["default", "verify"]

[lints]
workspace = true
